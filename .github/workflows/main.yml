name: Build and Release

on:
  push:
    tags:
      - 'r*' # Only triggers when you push a tag starting with 'r' (e.g. r140)

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_arch: win64_mingw81
          - os: ubuntu-20.04
            qt_arch: gcc_64
          - os: macos-latest
            qt_arch: clang_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: ${{ matrix.qt_arch }}

      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build Project
        shell: bash
        run: |
          mkdir build_assets
          cd build_assets
          qmake ../FSModTool.pro CONFIG+=release
          if [ "$RUNNER_OS" == "Windows" ]; then
            mingw32-make -j$(nproc)
          else
            make -j$(nproc)
          fi

      - name: Package Windows (win64)
        if: runner.os == 'Windows'
        shell: bash
        # github.ref_name will be "r140"
        run: mv *_Release.zip FSModTool-${{ github.ref_name }}-windows-x86_64.zip

      - name: Package Linux (lin64 & AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y libxcb-util1 zip
          zip -j FSModTool-${{ github.ref_name }}-linux-x86_64.zip build_assets/FSModTool
          
          wget -c "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          echo -e "[Desktop Entry]\nType=Application\nName=FSModTool\nExec=FSModTool\nIcon=FSModTool\nCategories=Development;" > FSModTool.desktop
          ./linuxdeployqt-continuous-x86_64.AppImage build_assets/FSModTool -appimage -unsupported-allow-new-glibc
          
          mv FSModTool-x86_64.AppImage FSModTool-linux-appimage.AppImage
          zip FSModTool-${{ github.ref_name }}-linux-appimage.zip FSModTool-linux-appimage.AppImage

      - name: Package macOS (mac64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt build_assets/FSModTool.app
          zip -r FSModTool-${{ github.ref_name }}-macos-x86_64.zip build_assets/FSModTool.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: FSModTool-*.zip

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          # Uses the actual tag name you pushed
          automatic_release_tag: "${{ github.ref_name }}"
          prerelease: false
          title: "FSModTool ${{ github.ref_name }}"
          files: |
            release_assets/FSModTool-*.zip